charly-local:
    candy:
        description: |-
            Concept candy owning the charly-local kind-authoring skills (local templates + ssh-host targets). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the local concept candy's skill entities are present and generated into the marketplace's local/skills
              id: charly-local-present
              context:
                - build
              command: "true"
local-deploy-skill:
    skill:
        name: local-deploy
        family: local
        owner: charly-local
        description: |-
            `target: local` deployments, the Ansible-style `host:` destination field (literal `local` for direct shell, anything else routes through ssh(1) reading `~/.ssh/config` + ssh-agent), the `local:` substrate kind and its `from:` template reference, the `user:`/`ssh_arg:` overrides, the managed ssh_config fragment, the install ledger, ReverseOp teardown, or the `--with-services`/`--allow-repo-changes`/`--allow-root-tasks` gates.

        triggers:
            - "local-target deploy / `target: local` / `host: local` (default) / SSH-host deploys / `user:` / `ssh_arg:`"
            - "Managed `~/.config/charly/ssh_config` fragment / `charly vm create` writes Host stanza"
local-spec-skill:
    skill:
        name: local-spec
        family: local
        owner: charly-local
        description: |-
            Authoring `kind: local` templates, `local.yml` files, inline `kind: local` template nodes in `charly.yml`, or the merge semantics between a `kind: local` template and the deploy that deploys it.

        triggers:
            - "Editing `local.yml` / authoring `kind: local` templates"
